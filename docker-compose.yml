version: '3.9'

# Local integration stack:
#   - db on host port 3307
#   - api runs on host (`npm run dev`) against DB_HOST=localhost DB_PORT=3307
#   - or: docker compose --profile containerized up --build  to run api in Docker (prod image)

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: aihub_db
      MYSQL_USER: aihub_user
      MYSQL_PASSWORD: aihub_pass
    ports:
      - '3307:3306'
    volumes:
      - aihub_db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['containerized']
    build: .
    ports:
      - '3400:3400'
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: aihub_db
      DB_USER: aihub_user
      DB_PASSWORD: aihub_pass
      ADMIN_SECRET: ${ADMIN_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3099,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy

volumes:
  aihub_db_data:
