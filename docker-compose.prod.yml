version: '3.9'

# Production stack — do not use bind mounts or weak defaults.
# Required env: ADMIN_SECRET, ENCRYPTION_KEY, DB_PASSWORD, MYSQL_ROOT_PASSWORD

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${AIHUB_PORT:-3400}:3400'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3400
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-aihub_db}
      DB_USER: ${DB_USER:-aihub_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      AI_PROVIDER_RETRY_ATTEMPTS: ${AI_PROVIDER_RETRY_ATTEMPTS:-1}
      AI_PROVIDER_RETRY_DELAY_MS: ${AI_PROVIDER_RETRY_DELAY_MS:-250}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_GENERATE_MAX: ${RATE_LIMIT_GENERATE_MAX:-30}
      RATE_LIMIT_TIME_WINDOW_MS: ${RATE_LIMIT_TIME_WINDOW_MS:-60000}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-2500000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-120000}
      MAX_CONCURRENT_PER_PROJECT: ${MAX_CONCURRENT_PER_PROJECT:-5}
      CONCURRENCY_LEASE_TTL_SECONDS: ${CONCURRENCY_LEASE_TTL_SECONDS:-180}
      QUOTA_RESERVE_TOKENS_PER_REQUEST: ${QUOTA_RESERVE_TOKENS_PER_REQUEST:-4000}
      QUOTA_RESERVE_COST_PER_REQUEST: ${QUOTA_RESERVE_COST_PER_REQUEST:-0.05}
      QUOTA_RESERVE_OUTPUT_TOKENS_DEFAULT: ${QUOTA_RESERVE_OUTPUT_TOKENS_DEFAULT:-1500}
      QUOTA_RESERVE_USD_PER_1K_TOKENS: ${QUOTA_RESERVE_USD_PER_1K_TOKENS:-0.01}
      QUOTA_RESERVE_SAFETY_MULT: ${QUOTA_RESERVE_SAFETY_MULT:-1.25}
      ADMIN_AUDIT_RETENTION_DAYS: ${ADMIN_AUDIT_RETENTION_DAYS:-90}
      ADMIN_AUDIT_AUTO_PURGE: ${ADMIN_AUDIT_AUTO_PURGE:-false}
      ADMIN_AUDIT_PURGE_INTERVAL_MS: ${ADMIN_AUDIT_PURGE_INTERVAL_MS:-86400000}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ['sh', '-c', 'node dist/migrate.js && node dist/server.js']

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-aihub_db}
      MYSQL_USER: ${DB_USER:-aihub_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - aihub_db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  aihub_db_data:
